  <!-- Script pour le rendu élégant du PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const pdfUrl = 'assets/recits/Histoire_Royaume-Ketou.pdf';
    const container = document.getElementById('pdf-viewer-container');
    const loader = document.getElementById('pdf-loader');

    // Spécifier le worker PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function renderPDF() {
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;

        // Retirer le loader une fois le PDF chargé
        loader.style.display = 'none';

        // Parcourir chaque page
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);

          // Calculer l'échelle pour une bonne qualité
          const viewport = page.getViewport({ scale: 1.5 });

          // Créer un canvas pour la page
          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-page-canvas';
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          // Ajouter le canvas au conteneur
          container.appendChild(canvas);

          // Rendre la page
          const renderContext = {
            canvasContext: context,
            viewport: viewport
          };
          await page.render(renderContext).promise;
          console.log(`Page ${pageNum} rendue`);
        }
      } catch (error) {
        console.error('Erreur lors du chargement du PDF:', error);
        loader.innerHTML = '<p class="text-danger">Impossible de charger le document. Veuillez vérifier si le fichier existe.</p>';
      }
    }

    // Lancer le rendu
    renderPDF();
  </script>
